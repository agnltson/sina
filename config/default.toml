[preprocessor]
skip_factor = 10 # Optional: skip half the input video frame (default: 2)
num_workers = 2 # Optional: thread used (default: available logical core)
queue_capacity = 256 # Optional: internal decoded queue capacity (default: 32)
min_observation = 5 # Optional: number of frame a tag must appear to be consider valid (default: 5)
max_hamming = 1 # Option: error tolerance

# Recording camera intrinsic
fx = 450.0
fy = 450.0
cx = 704.0
cy = 704.0

[streaming]
profile = "profile12" # Streaming profile (need rgb camera)
ip = "10.139.32.218" # Glasses ip available in aria app

# Streaming camera intrinsic
fx = 450.0
fy = 450.0
cx = 704.0
cy = 704.0

[apriltag]
tag_family = "tag36h11"
tag_size_m = 0.16 # Tag size in meter
