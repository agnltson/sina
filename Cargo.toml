[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
cc = "1"

[package]
name = "sina"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
eframe = "0.35.0"
ffmpeg-next = "8.1.0"
i_overlay = "7.0.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
nalgebra = "0.35.0"
num_cpus = "1.17.0"
ordered-float = "5.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
spade = "2.15.1"
toml = "1.1.2"
winnow = "1.0.3"
zmq = "0.10.0"
